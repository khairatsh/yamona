<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هبوط نور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#10213a;--gold:#ffc94a;--txt:#f4f8ff;--glass:rgba(16,33,58,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--ink);font-family:'Cairo',Tahoma,sans-serif;color:var(--txt);overflow:hidden;touch-action:none;user-select:none}
canvas{display:block;width:100%;height:100%}
.glass{background:var(--glass);backdrop-filter:blur(8px);border-radius:16px;padding:8px 14px}
#stats{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:12px;font-weight:900;font-size:16px;line-height:1.55;min-width:150px}
#top{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:12px;font-weight:900;font-size:16px;text-align:center;line-height:1.55}
#hint{position:absolute;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:100%;text-align:center;font-weight:900;font-size:22px;text-shadow:0 2px 8px #000;pointer-events:none}
#bar{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#bar>*{pointer-events:auto}
.b{font:inherit;font-weight:900;font-size:19px;border:0;border-radius:16px;padding:14px 20px;background:var(--glass);color:var(--txt);backdrop-filter:blur(8px)}
.b:active{transform:scale(.95)}
#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(16,33,58,.5);text-align:center;padding:20px}
#panel.hide{display:none}
h1{font-size:clamp(40px,11vw,76px);font-weight:900;margin:0;color:var(--gold);text-shadow:0 0 30px rgba(255,201,74,.55)}
p{margin:0;font-size:17px;max-width:420px;line-height:1.75}
#go{font:inherit;font-weight:900;font-size:22px;border:0;border-radius:40px;padding:12px 44px;background:var(--gold);color:var(--ink);cursor:pointer;margin-top:8px}
#go:focus-visible,.b:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<div id="stats" class="glass"><div id="s1"></div><div id="s2"></div><div id="s3"></div><div id="s4"></div></div>
<div id="top" class="glass"><div id="t1"></div><div id="t2"></div></div>
<div id="hint"></div>
<div id="bar"><div style="display:flex;gap:8px"><button id="tu" class="b">▲ محرك</button><button id="td" class="b">▼ محرك</button></div><div style="display:flex;gap:8px"><button id="cm" class="b" aria-label="الكاميرا">📷</button><button id="br" class="b">فرامل</button></div></div>
<div id="fade" style="position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s"></div>
<div id="panel"><h1 id="ttl">هبوط نور</h1><p id="msg">أنت واقف في المطار. شاهد الركاب وهم يصعدون، ثم أقلع وحلّق وهبّط بنعومة. الرحلات تتكرر بلا توقف.<br>الأسهم للتحكم، W/S للمحرك، Space فرامل، C للكاميرا. بالجوال اسحب بإصبعك.</p><button id="go">ابدأ الرحلة</button></div>

let tu=0,td=0,brk=0,dRoll=0,dPit=0,ox=0,oy=0,drag=false;const keys={};

function teleport(){P.set(0,0,560);h=0;pit=0;rol=0;spd=0;thr=0;vy=0;onG=true;flew=false}
